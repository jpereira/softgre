<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" role="img" aria-labelledby="title desc">
  <title id="title">SoftGRE traffic flow</title>
  <desc id="desc">Access points tunnel VLAN-tagged client traffic over IPv4 GRE to a Linux concentrator. softgred learns each remote and client MAC, creates gretap and VLAN interfaces, attaches them to bridges and permits learned MACs. An optional DHCP server hands out a different network, mask, gateway and DNS on each bridge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7c3aed"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h { font-size: 15px; font-weight: 700; }
    .t { font-size: 13px; }
    .s { font-size: 12px; fill: #475569; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .radius { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .hotspot { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .control { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
    .data { fill: none; stroke: #334155; stroke-width: 2; }
    .lb { fill: none; stroke: #2563eb; stroke-width: 2; }
    .lo { fill: none; stroke: #ea580c; stroke-width: 2; }
    .ctl { fill: none; stroke: #7c3aed; stroke-width: 1.8; stroke-dasharray: 6 4; }
  </style>

  <rect width="1280" height="680" rx="18" fill="#f8fafc"/>
  <text x="32" y="46" style="font-size:22px;font-weight:700">SoftGRE traffic flow</text>
  <text x="32" y="70" class="s">APs are configured once. The concentrator learns every new AP and client from the GRE traffic itself.</text>

  <!-- Access points -->
  <g>
    <rect x="32" y="110" width="236" height="210" rx="12" class="box"/>
    <text x="48" y="136" class="h">Access point A</text>
    <text x="48" y="156" class="s mono">wan 192.0.2.2</text>
    <rect x="48" y="170" width="204" height="44" rx="8" class="radius"/>
    <text x="60" y="189" class="t">Client · VLAN 1000</text>
    <text x="60" y="205" class="s mono">02:10:00:00:02:01</text>
    <rect x="48" y="222" width="204" height="44" rx="8" class="hotspot"/>
    <text x="60" y="241" class="t">Client · VLAN 10</text>
    <text x="60" y="257" class="s mono">02:10:00:00:02:02</text>
    <text x="48" y="296" class="s">gretap → 192.0.2.1, 802.1Q</text>
  </g>
  <g>
    <rect x="32" y="350" width="236" height="210" rx="12" class="box"/>
    <text x="48" y="376" class="h">Access point B</text>
    <text x="48" y="396" class="s mono">wan 192.0.2.3</text>
    <rect x="48" y="410" width="204" height="44" rx="8" class="radius"/>
    <text x="60" y="429" class="t">Client · VLAN 1000</text>
    <text x="60" y="445" class="s mono">02:10:00:00:03:01</text>
    <rect x="48" y="462" width="204" height="44" rx="8" class="hotspot"/>
    <text x="60" y="481" class="t">Client · VLAN 10</text>
    <text x="60" y="497" class="s mono">02:10:00:00:03:02</text>
    <text x="48" y="536" class="s">gretap → 192.0.2.1, 802.1Q</text>
  </g>

  <!-- Provider network -->
  <rect x="290" y="110" width="128" height="450" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="354" y="140" class="h" text-anchor="middle">IPv4 network</text>
  <text x="354" y="160" class="s" text-anchor="middle">GRE, protocol 47</text>
  <text x="354" y="512" class="s" text-anchor="middle">Ethernet 0x6558</text>
  <text x="354" y="528" class="s" text-anchor="middle">+ VLAN tag</text>
  <path d="M268 215 C 360 215, 380 330, 466 330" class="data" marker-end="url(#arrow)"/>
  <path d="M268 455 C 360 455, 380 346, 466 346" class="data" marker-end="url(#arrow)"/>

  <!-- Concentrator host -->
  <rect x="440" y="96" width="816" height="530" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="460" y="122" class="h">Linux concentrator</text>

  <!-- softgred control plane -->
  <rect x="468" y="138" width="336" height="118" rx="10" class="control"/>
  <text x="484" y="162" class="h">softgred</text>
  <text x="484" y="184" class="t">1. Learn remote IPv4 and client MAC</text>
  <text x="484" y="204" class="t">2. NETLINK_ROUTE: gretap + VLAN, attach</text>
  <text x="484" y="224" class="t">3. ebtables: allow each learned MAC</text>
  <text x="484" y="244" class="s">Ignores unknown VLANs and foreign targets</text>

  <rect x="826" y="138" width="190" height="118" rx="10" class="box"/>
  <text x="842" y="162" class="h">Dashboard</text>
  <text x="842" y="184" class="t mono">:8080 HTTP</text>
  <text x="842" y="204" class="t">Tunnels, MACs,</text>
  <text x="842" y="222" class="t">bridges, counters</text>
  <text x="842" y="244" class="s mono">API lo:8888</text>
  <path d="M804 197 H 820" class="ctl" marker-end="url(#arrow-control)"/>

  <!-- capture interface -->
  <rect x="468" y="296" width="146" height="84" rx="10" class="box"/>
  <text x="484" y="320" class="h mono">eth0</text>
  <text x="484" y="340" class="t mono">192.0.2.1</text>
  <text x="484" y="362" class="s">AF_PACKET + BPF</text>
  <path d="M520 296 V 262" class="ctl" marker-end="url(#arrow-control)"/>
  <text x="528" y="284" class="s">copy</text>

  <!-- tunnels -->
  <rect x="650" y="296" width="154" height="116" rx="10" class="box"/>
  <text x="666" y="320" class="h mono">sgre0</text>
  <text x="726" y="320" class="s">AP A</text>
  <rect x="664" y="332" width="126" height="30" rx="6" class="radius"/>
  <text x="676" y="352" class="t mono">sgre0.1000</text>
  <rect x="664" y="370" width="126" height="30" rx="6" class="hotspot"/>
  <text x="676" y="390" class="t mono">sgre0.10</text>

  <rect x="650" y="440" width="154" height="116" rx="10" class="box"/>
  <text x="666" y="464" class="h mono">sgre1</text>
  <text x="726" y="464" class="s">AP B</text>
  <rect x="664" y="476" width="126" height="30" rx="6" class="radius"/>
  <text x="676" y="496" class="t mono">sgre1.1000</text>
  <rect x="664" y="514" width="126" height="30" rx="6" class="hotspot"/>
  <text x="676" y="534" class="t mono">sgre1.10</text>

  <path d="M614 330 H 646" class="data" marker-end="url(#arrow)"/>
  <path d="M614 350 C 632 350, 628 498, 646 498" class="data" marker-end="url(#arrow)"/>
  <text x="474" y="404" class="s">kernel decapsulates</text>
  <path d="M700 256 V 290" class="ctl" marker-end="url(#arrow-control)"/>
  <text x="708" y="280" class="s">creates</text>

  <!-- bridges -->
  <rect x="846" y="320" width="170" height="76" rx="10" class="radius"/>
  <text x="862" y="346" class="h mono">br-radius</text>
  <text x="862" y="366" class="t">VLAN 1000</text>
  <text x="862" y="384" class="s">ebtables per MAC</text>

  <rect x="846" y="470" width="170" height="76" rx="10" class="hotspot"/>
  <text x="862" y="496" class="h mono">br-hotspot</text>
  <text x="862" y="516" class="t">VLAN 10</text>
  <text x="862" y="534" class="s">ebtables per MAC</text>

  <path d="M790 347 H 842" class="lb" marker-end="url(#arrow-blue)"/>
  <path d="M790 491 C 820 491, 818 372, 842 372" class="lb" marker-end="url(#arrow-blue)"/>
  <path d="M790 385 C 820 385, 818 496, 842 496" class="lo" marker-end="url(#arrow-orange)"/>
  <path d="M790 529 C 816 529, 822 520, 842 520" class="lo" marker-end="url(#arrow-orange)"/>

  <!-- optional DHCP -->
  <rect x="1040" y="290" width="200" height="296" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1056" y="314" class="h">DHCP server</text>
  <text x="1056" y="332" class="s">optional, e.g. dnsmasq</text>
  <rect x="1054" y="344" width="172" height="100" rx="8" class="radius"/>
  <text x="1066" y="364" class="t mono">10.100.0.0/24</text>
  <text x="1066" y="382" class="s mono">mask 255.255.255.0</text>
  <text x="1066" y="400" class="s mono">gw 10.100.0.1</text>
  <text x="1066" y="418" class="s mono">dns 1.1.1.1</text>
  <rect x="1054" y="460" width="172" height="100" rx="8" class="hotspot"/>
  <text x="1066" y="480" class="t mono">172.16.10.0/23</text>
  <text x="1066" y="498" class="s mono">mask 255.255.254.0</text>
  <text x="1066" y="516" class="s mono">gw 172.16.10.1</text>
  <text x="1066" y="534" class="s mono">dns 8.8.8.8</text>
  <path d="M1016 358 H 1050" class="lb" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <path d="M1016 508 H 1050" class="lo" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>

  <!-- legend -->
  <path d="M460 650 H 500" class="data" marker-end="url(#arrow)"/>
  <text x="510" y="654" class="s">Kernel data path (forwarded by Linux, not by softgred)</text>
  <path d="M900 650 H 940" class="ctl" marker-end="url(#arrow-control)"/>
  <text x="950" y="654" class="s">Discovery and provisioning</text>
</svg>
