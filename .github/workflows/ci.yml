name: Linux validation
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  compilers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build test image
        run: |
          dockerfile=docker/Dockerfile.test
          test -f "$dockerfile" || dockerfile=Dockerfile.test
          docker build -f "$dockerfile" -t softgre-test .
      - name: GCC, Clang, sanitizers, installation and distribution
        run: docker run --rm softgre-test scripts/check-linux.sh
      - name: Real GRE, VLAN, firewall and API integration
        run: >-
          docker run --rm --cap-add NET_ADMIN --cap-add NET_RAW
          -e SOFTGRE_TEST_NAMESPACE=isolated softgre-test
          python3 tests/integration.py /usr/sbin/softgred
      - name: Remote allowlist and MAC ownership at the local gateway
        run: >-
          docker run --rm --cap-add NET_ADMIN --cap-add NET_RAW
          -e SOFTGRE_TEST_NAMESPACE=isolated softgre-test
          python3 tests/security_integration.py /usr/sbin/softgred
      - name: Per-bridge DHCP leases through learned tunnels
        run: >-
          docker run --rm --privileged
          -e SOFTGRE_TEST_NAMESPACE=isolated softgre-test
          python3 tests/dhcp_integration.py /usr/sbin/softgred
      - name: Python and PHP adapters
        run: docker run --rm softgre-test python3 tests/test_web.py
      - name: Debian package
        run: docker run --rm softgre-test scripts/check-installed-package.sh
      - name: Production container
        run: |
          dockerfile=docker/Dockerfile
          test -f "$dockerfile" || dockerfile=Dockerfile
          docker build -f "$dockerfile" -t softgre .
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: python3 scripts/build-docs.py
      - run: python3 tests/test_docs.py
      - run: python3 tests/test_version.py
      - run: ./bump.sh --check
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Ubuntu 24.04 lab image
        if: hashFiles('docker/Dockerfile.lab') != ''
        run: docker build -f docker/Dockerfile.lab -t softgre-lab:ubuntu24.04 .
      - name: Dashboard, GRE provisioning and container lifecycle
        if: hashFiles('docker/Dockerfile.lab') != ''
        run: scripts/check-lab.sh
      - name: Ubuntu 24.04 gateway image
        if: hashFiles('scripts/check-gateway.sh') != ''
        run: docker build -f docker/Dockerfile.lab --target gateway -t softgre-gateway:ubuntu24.04 .
      - name: External AP containers, DHCP per bridge and lease hook
        if: hashFiles('scripts/check-gateway.sh') != ''
        run: scripts/check-gateway.sh
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build formatter image
        if: hashFiles('docker/Dockerfile.format') != ''
        run: docker build -f docker/Dockerfile.format -t softgre-format .
      - name: Check consistent source formatting
        if: hashFiles('docker/Dockerfile.format') != ''
        run: docker run --rm softgre-format scripts/format-code.sh --check
